# Pushes the example templates in this repo to a Coder instance for
# testing. Each template is a self-contained directory (see README) pushed
# independently via `coder templates push` — this repo has no CI/CD of its
# own, these are reference templates for customers to adapt.

version: '3'

dotenv: ['.env']

tasks:

  up:
    desc: 'Validate, then push a template. Usage: task up TEMPLATE=openshift-gpu-mig'
    cmds:
      - task: validate
      - task: push

  push:
    desc: 'Push one template to Coder. Usage: task push TEMPLATE=openshift-gpu-mig [VARS_FILE=path]'
    preconditions:
      - sh: '[ -n "{{.TEMPLATE}}" ]'
        msg: 'TEMPLATE is required, e.g. task push TEMPLATE=openshift-gpu-mig'
      - sh: '[ -d "{{.TEMPLATE}}" ]'
        msg: 'No such template directory: {{.TEMPLATE}}'
    cmds:
      - coder templates push {{.TEMPLATE}} -d ./{{.TEMPLATE}} {{if .VARS_FILE}}--variables-file {{.VARS_FILE}}{{end}} --yes

  validate:
    desc: 'terraform fmt/validate for every template directory, or just TEMPLATE=<dir>'
    cmds:
      - |
        set -euo pipefail
        if [ -n "{{.TEMPLATE}}" ]; then
          if [ ! -d "{{.TEMPLATE}}" ]; then
            echo "No such template directory: {{.TEMPLATE}}" >&2
            exit 1
          fi
          dirs="{{.TEMPLATE}}"
        else
          dirs=$(find . -maxdepth 1 -mindepth 1 -type d ! -name '.*' -exec basename {} \;)
        fi
        for d in $dirs; do
          echo "[validate] $d"
          terraform -chdir="$d" init -backend=false -input=false >/dev/null
          terraform -chdir="$d" fmt -check -diff
          terraform -chdir="$d" validate
          rm -rf "$d/.terraform" "$d/.terraform.lock.hcl"
        done
